# Проверено с oh-my-pi 17.4.2: кастомный AIS endpoint для Qwen3.6:27b
# Файл назначения: ~/.omp/agent/models.yml

providers:
  # Основной transport: Anthropic Messages показал стабильную работу в
  # длительном tool-heavy прогоне.
  ais:
    baseUrl: https://api.ais.mir/v1
    api: anthropic-messages
    auth: apiKey

    # Локальный секрет берётся из окружения. authHeader намеренно не задан:
    # Anthropic transport должен отправить API key штатным способом, а не
    # наследовать OpenAI-compatible Authorization: Bearer.
    apiKey: AIS_API_KEY

    models:
      - id: "qwen3.6:27b"
        name: "Qwen 3.6 27B (AIS)"
        reasoning: true
        supportsTools: true
        input:
          - text
          - image
        contextWindow: 131000
        maxTokens: 16384

        # Anthropic-specific compat OMP определяет автоматически.

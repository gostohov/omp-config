# Конфигурация oh-my-pi для Qwen3.6:27b через AIS
# Файл назначения: ~/.omp/agent/config.yml

# OMP обращается напрямую к HTTP API SearXNG.
# Это адрес самого SearXNG, а не MCP-прокси.
searxng:
  endpoint: http://127.0.0.1:8080

providers:
  # Общий для локальных OMP-процессов предел запросов к AIS. Пять sub-агентов
  # могут работать параллельно, оставляя шестой слот родительскому агенту.
  maxInFlightRequests:
    ais: 6

  # Публичный поиск разрешён только через локальный SearXNG.
  webSearchOrder:
    - searxng
  webSearchExclude:
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public

  # Заголовки генерируются лёгкой локальной CPU-моделью. Память использует
  # корпоративный AIS endpoint, а проверка преждевременной остановки —
  # локальную модель, предназначенную для memory/classifier-задач.
  tinyModel: lfm2-350m
  memoryModel: online
  unexpectedStopModel: lfm2-1.2b

exa:
  enabled: false

# Полностью исключаем discovery-источники других агентов и IDE. Они больше не
# смогут добавлять context-файлы, MCP, команды, skills, hooks, tools, prompts
# или settings. Нативные источники OMP, OMP plugins и обычный .mcp.json остаются.
disabledProviders:
  - agent-plugins
  - agents
  - agents-md
  - claude
  - claude-plugins
  - cline
  - codex
  - cursor
  - gemini
  - github
  - opencode
  - vscode
  - windsurf

# Маскируем credential-shaped значения до отправки модели и при публикации.
secrets:
  enabled: true

# Не отправляем автоматические QA-отчёты. Проверку обновлений оставляем
# включённой, а повторный setup wizard после первичной настройки пропускаем.
dev:
  autoqa: false

startup:
  checkUpdate: true
  setupWizard: false

share:
  redactSecrets: true

# Не очищаем terminal scrollback при изменении размера окна. Старые строки
# сохраняют прежний перенос, а текущий viewport перерисовывается без потери
# предшествующей запуску OMP истории.
tui:
  resizeScrollback: preserve

# Встроенный browser и relay выключены: авторизованным Windows Chrome управляет
# установленный отдельно Playwright CLI skill через WSL-wrapper.
browser:
  enabled: false
  relay: false
  relayUrl: http://127.0.0.1:9224
  # Неактивный fallback на случай будущего включения встроенного browser tool.
  headless: true

images:
  # Изображения отправляются только корпоративному AIS при явном приложении.
  blockImages: false

# Не продолжаем автоматически потенциально устаревший диалог из каталога.
autoResume: false

# Все роли запускаются без thinking: этот режим оказался стабильнее в длинных
# tool-heavy задачах. Детектор ниже остаётся страховкой от преждевременных
# остановок. Кавычки не дают YAML 1.1 преобразовать off в boolean false.
defaultThinkingLevel: "off"
hideThinkingBlock: true

# Параметры Qwen3.6:27b для non-thinking режима.
# Формат запроса определяет активный provider из models.yml.
temperature: 0.7
topP: 0.8
topK: 20
presencePenalty: 1.5
repetitionPenalty: 1.0

# Все роли направляем через проверенный Anthropic Messages transport.
# Формат роли — строка provider/model:thinking, а не объект.
modelRoles:
  default: "ais/qwen3.6:27b:off"
  plan: "ais/qwen3.6:27b:off"
  slow: "ais/qwen3.6:27b:off"
  smol: "ais/qwen3.6:27b:off"
  task: "ais/qwen3.6:27b:off"
  tiny: "ais/qwen3.6:27b:off"
  commit: "ais/qwen3.6:27b:off"
  designer: "ais/qwen3.6:27b:off"
  vision: "ais/qwen3.6:27b:off"

# Переживаем краткие сбои AIS, но не ждём многоминутные retry-окна.
retry:
  enabled: true
  maxRetries: 5
  baseDelayMs: 500
  maxDelayMs: 30000
  modelFallback: false

# Фоновые task-задания включены явно.
async:
  enabled: true

task:
  # До пяти sub-агентов могут работать параллельно. Вместе с родительским
  # агентом это соответствует лимиту AIS maxInFlightRequests: 6 выше.
  maxConcurrency: 5
  # Разрешён только один дочерний уровень: sub-агенты не порождают новых.
  maxRecursionDepth: 1
  # Сохраняем проверенный плоский формат отдельных task tool calls.
  batch: false
  # OMP предпочитает сразу запускать подходящие независимые задачи в фоне.
  eager: preferred

tools:
  # Tool calls выполняются без интерактивных подтверждений; опасные операции
  # по-прежнему ограничиваются системными правилами OMP и инструкциями проекта.
  approvalMode: yolo
  # auto оставляет provider-native function calling, так как в models.yml
  # модель явно объявлена с supportsTools: true.
  format: auto

# Направляем Qwen к специализированным read/grep/write/hub tools вместо их
# менее наблюдаемых shell-аналогов.
bashInterceptor:
  enabled: true

# Для Qwen full descriptors остаются в JSON-схемах tools и не дублируются
# в системном prompt. Это снижает его размер без отключения описаний tools.
inlineToolDescriptors: "off"

model:
  toolCallLoopGuard:
    enabled: true
    # Раннее вмешательство после трёх полностью одинаковых вызовов подряд.
    threshold: 3

features:
  # Smart включает механическое восстановление невидимых остановок и локальный
  # classifier для текстовых обещаний действия, завершившихся без tool call.
  unexpectedStopDetection: smart

compaction:
  # Используем только локальный snapcompact, без внешней remote-компактации.
  methodOrder:
    - snapcompact
  # Не доводим 131k-контекст до края: качество tool calls у Qwen снижается
  # раньше формального переполнения. 80% оставляет запас для ответа и tools.
  thresholdPercent: 80
  remoteStreamingV2Enabled: false

# Локальная SQLite-память изолирована по проектам. FTS-режим не загружает
# embedding-модель и подходит для CPU-only машины.
memory:
  backend: mnemopi

mnemopi:
  scoping: per-project
  noEmbeddings: true
  llmMode: smol
  autoRecall: true
  autoRetain: true
  retainEveryNTurns: 4
  recallLimit: 4
  injectionTokenLimit: 2000

skills:
  enabled: true

  # Дополнительная защита на уровне skills. Основное отключение всех типов
  # настроек выполняет disabledProviders выше.
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  # native = собственные ~/.omp/agent/skills и <project>/.omp/skills.
  enablePiUser: true
  enablePiProject: true
  enableAgentsUser: false
  enableAgentsProject: false

# Advisor выключен: та же Qwen-модель добавляет запрос и контекст, но не даёт
# независимого второго мнения.
advisor:
  enabled: false

setupVersion: 1

autocompleteMaxVisible: 15
